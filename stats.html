
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stats - My Little Habits</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">

            <div class="app-name">
                MY LITTLE HABITS ✦
            </div>

            <h1>Statistics</h1>

            <p class="subtitle">
                Every little step adds up.
            </p>

        </header>

        
<!-- HABIT STATISTICS -->

<section class="stats-section">

    <h2>Your Habit Statistics</h2>

    <div id="stats-container">

        <!-- JavaScript will create the cards -->

    </div>

</section>


<!-- MONTHLY PROGRESS GRAPH -->

<section class="graph-section">

    <h2>Monthly Progress</h2>

    <p class="graph-subtitle">
        Your habits throughout the month.
    </p>


<!-- GRAPH MONTH NAVIGATION -->

<div class="graph-navigation">

    <button id="graph-previous" type="button">
        ❮
    </button>

    <span id="graph-month-title">
        Month
    </span>

    <button id="graph-next" type="button">
        ❯
    </button>

</div>


    <div id="habit-graph">

        <!-- JavaScript will build our graph here -->

    </div>

</section>


    </main>
