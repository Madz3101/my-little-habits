    <main class="app">

        <header class="app-header">

            <div class="app-name">
                MY LITTLE HABITS ✦
            </div>

            <h1>Settings</h1>

            <p class="subtitle">
                Make this little space yours.
            </p>

        </header>

        <!-- SETTINGS CONTENT -->

<section class="settings-section">

    <h2>💾 Backup & Restore</h2>

    <p>
        Save a copy of your habit history so you
        can restore it on another device.
    </p>

    <button id="export-backup" type="button">
        ⬇️ Export Backup
    </button>


<!-- RESTORE BACKUP -->

<button id="restore-backup" type="button">
    ⬆️ Restore Backup
</button>

<input
    type="file"
    id="backup-file"
    accept=".json,application/json"
    hidden
>


    <p id="backup-message"></p>

</section>
